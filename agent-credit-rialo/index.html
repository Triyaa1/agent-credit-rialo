      // caused by competing web3 extensions (e.g. OKX, MetaMask, Phantom) injecting into window.ethereum
      (function() {
        try {
          var _origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(target, prop, descriptor) {
            if (target === window && prop === 'ethereum') {

                var safeDesc = Object.assign({}, descriptor, { configurable: true });

              } catch (e) {

                // do not crash the app; attempt to set the property or swallow the collision.
                try {
                  if (descriptor && 'value' in descriptor) {
                    target.ethereum = descriptor.value;
                  }
                } catch (_) {}
                return target;
              }
            }
            return _origDefineProperty.apply(Object, arguments);
          };

          window.addEventListener('error', function(event) {
            var msg = (event && (event.message || (event.error && event.error.message))) || '';
            if (typeof msg === 'string' && msg.indexOf('Cannot redefine property: ethereum') !== -1) {
              if (event.preventDefault) event.preventDefault();
